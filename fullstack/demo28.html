<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        .container{
            width: 90vw;
            height: 90vh;
            outline: 2px solid black;
            display: flex;
            flex-direction: row;
        }

        .container>div{
            color: white;
            height: 100px;
        }

        #box1{
            background-color: blue;
            flex-basis: 100px;
            flex-grow: 3;
        }
        #box2{
            background-color: yellow;
            flex-basis: 100px;
            flex-grow: 1;
        }
        #box3{
            background-color: red;
            flex-basis: 100px;
            flex-grow: 1;
        }
        #box4{
            background-color: violet;
            flex-basis: 100px;
            flex-grow: 1;
        }
        #box5{
            background-color: green;
            flex-basis: 100px;
            flex-grow: 1;
        }

        

    </Style>
</head>
<body>
    <div class="container">
    <div id="box1"></div>
    <div id="box2"></div>
    <div id="box3"></div>
    <div id="box4"></div>
    <div id="box5"></div>
    </div>

</body>
</html>
