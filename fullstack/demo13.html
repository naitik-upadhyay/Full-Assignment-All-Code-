<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        body{
            background-color: black;
        }
        .box{
            height: 200px;
            width: 200px;
            border-radius: 50%;
            background: conic-gradient(skyblue 25%,blue 50%,red 75%, black 100%);
        }
        h1{
            margin: 100px;
            position: relative;   
            width: 100px;
            height: 100px;
            background-color: black;
            border-radius: 50%;
            text-align: center;
            color: white;
        }

    </style>
</head>
<body>
    <div class="box">
        <h1>87%</h1>
    </div>
    
</body>
</html>
