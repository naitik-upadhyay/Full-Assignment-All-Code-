<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            background-color: black;
            box-shadow: 3px 10px 20px 30px;
            color: white;
        }
        button:active{
            background-color: yellow;
            color: red;
        }
        button:focus{
            box-shadow: 3px 10px 20px 30px;
            color: grey;
        }
        a:link{
            color: white;
            background-color: black;
        }
        a:visited{
            color: yellow;
        }
    </style>
</head>
<body>
    <button> Click Me!</button>
    <a href="#">Link</a>
</body>
</html>
